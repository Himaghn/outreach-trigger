name: Build dashboard

# Rebuilds the password-protected dashboard website from the private
# Prof-outreach repo about every 15 minutes. Only the encrypted data is
# published; nothing private is printed in these (public) logs.
#
# Needs two secrets in this repo:
#   OUTREACH_TOKEN      - the existing token, with "Contents: Read-only" added
#   DASHBOARD_PASSWORD  - the password you type on the website (8+ characters)
# Until both are in place the run just skips (no failure emails).
on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check setup
        id: ready
        env:
          TOKEN: ${{ secrets.OUTREACH_TOKEN }}
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ ${#PW} -lt 8 ]; then
            echo "::warning::Add a DASHBOARD_PASSWORD secret (8+ characters) to build the dashboard."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Himaghn/Prof-outreach/contents/config.yaml)
          if [ "$code" != "200" ]; then
            echo "::warning::OUTREACH_TOKEN can't read Prof-outreach yet (HTTP $code). Add 'Contents: Read-only' to the token."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          repository: Himaghn/Prof-outreach
          token: ${{ secrets.OUTREACH_TOKEN }}
          path: private
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Build encrypted site
        if: steps.ready.outputs.go == 'true'
        env:
          PYTHONPATH: private/src
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          pip install -q pyyaml cryptography
          mkdir -p _site
          python -m outreach.dashboard --json "$RUNNER_TEMP/data.json"
          python dashboard/encrypt.py "$RUNNER_TEMP/data.json" _site/data.json
          rm -f "$RUNNER_TEMP/data.json"
          cp dashboard/index.html _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
          rm -rf private

      - uses: actions/configure-pages@v5
        if: steps.ready.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.ready.outputs.go == 'true'
        with:
          path: _site

      # GitHub's Pages service fails now and then ("No artifacts named github-pages").
      # Try twice and don't fail the run over it: the next rebuild is 15 minutes
      # away, and the website itself warns if its data gets more than 2 hours old.
      - id: deploy
        if: steps.ready.outputs.go == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.ready.outputs.go == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.ready.outputs.go == 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
