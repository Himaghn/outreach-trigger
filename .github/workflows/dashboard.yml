name: Build dashboard

# Rebuilds the password-protected dashboard website from the private
# Prof-outreach repo about every 15 minutes. Only the encrypted data is
# published; nothing private is printed in these (public) logs.
#
# Needs two secrets in this repo:
#   OUTREACH_TOKEN      - the existing token, with "Contents: Read-only" added
#   DASHBOARD_PASSWORD  - the password you type on the website (8+ characters)
# Until both are in place the run just skips (no failure emails).
on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # pushes the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check setup
        id: ready
        env:
          TOKEN: ${{ secrets.OUTREACH_TOKEN }}
          PW: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ ${#PW} -lt 8 ]; then
            echo "::warning::Add a DASHBOARD_PASSWORD secret (8+ characters) to build the dashboard."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Himaghn/Prof-outreach/contents/config.yaml)
          if [ "$code" != "200" ]; then
            if [ "$code" = "401" ]; then
              echo "::warning::OUTREACH_TOKEN was rejected (HTTP 401): it expired or was regenerated. Paste the current token into the OUTREACH_TOKEN secret."
            else
              echo "::warning::OUTREACH_TOKEN can't read Prof-outreach (HTTP $code). Give the token 'Contents: Read-only' on Prof-outreach."
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          repository: Himaghn/Prof-outreach
          token: ${{ secrets.OUTREACH_TOKEN }}
          path: private
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Build encrypted site
        if: steps.ready.outputs.go == 'true'
        env:
          PYTHONPATH: private/src
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          pip install -q pyyaml cryptography
          mkdir -p _site
          python -m outreach.dashboard --json "$RUNNER_TEMP/data.json"
          python dashboard/encrypt.py "$RUNNER_TEMP/data.json" _site/data.json
          rm -f "$RUNNER_TEMP/data.json"
          cp dashboard/index.html _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
          rm -rf private

      # Published by pushing the built site to the gh-pages branch (Settings > Pages >
      # Deploy from a branch: gh-pages, / root). The Actions-based Pages deploy kept
      # reporting success while serving a copy frozen at 24 Nov, so it's no longer used.
      # The branch holds one commit, replaced on every build, with only the encrypted
      # data.json, the page, robots.txt and .nojekyll: nothing that isn't already public.
      - name: Publish to gh-pages
        if: steps.ready.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard build $(date -u +%FT%TZ)"
          for i in 1 2; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages && break
            sleep 20
          done
