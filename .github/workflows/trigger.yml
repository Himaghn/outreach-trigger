name: Start outreach sender

# Starts "Send due emails" in the private Prof-outreach repo a few times just
# after each region's 08:30 morning window opens. The private job decides what
# is actually due, so a start with nothing due simply does nothing.
#
# Windows open at hh:30 UTC (every target time zone is a whole number of hours
# off UTC). Opening times covered, summer and winter time:
#   00:30 Singapore/Hong Kong   06:30-08:30 Europe and UK   12:30-13:30 Toronto
#   21:30-22:30 Sydney/Melbourne and 23:30 Tokyo/Seoul (previous UTC day)
# Each opening gets starts at about +2, +10, +20 and +35 minutes.
on:
  schedule:
    - cron: "32,40,50 0,6,7,8,12,13 * * 1-5"
    - cron: "5 1,7,8,9,13,14 * * 1-5"
    - cron: "32,40,50 21,22,23 * * 0-4"
    - cron: "5 22,23 * * 0-4"
    - cron: "5 0 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start the private sender
        env:
          TOKEN: ${{ secrets.OUTREACH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "The OUTREACH_TOKEN secret is missing."; exit 1; fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Himaghn/Prof-outreach/actions/workflows/send.yml/dispatches \
              -d '{"ref":"main"}')
            echo "Attempt $attempt: GitHub answered $code (204 means the sender was started)"
            if [ "$code" = "204" ]; then exit 0; fi
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ]; then
              echo "The token was refused: check it has Actions read/write on Prof-outreach and has not expired."
              exit 1
            fi
            sleep 10
          done
          exit 1
